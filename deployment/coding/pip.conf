# pip in the coding sandbox (CB-239): PyPI through the egress proxy's
# read-only virtual hosts. The proxy rewrites the Simple API's
# files.pythonhosted.org links to pypi-files.registry.socio.internal.
[global]
index-url = http://pypi.registry.socio.internal/simple/
trusted-host =
    pypi.registry.socio.internal
    pypi-files.registry.socio.internal
disable-pip-version-check = true
no-input = true
