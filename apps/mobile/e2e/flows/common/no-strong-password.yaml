# iOS offers "Use Strong Password?" in a sheet over a new-password field (the floor session checks
# the real thing, IV's note); this closes it with its X so the test types its own password. The
# sheet isn't in the app's hierarchy, so the X is tapped where iOS puts it.
appId: ${APP_ID}
name: no strong password
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Use Strong Password.*'
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: 'Use Strong Password.*'
          commands:
            - tapOn:
                text: 'Close'
                optional: true
      - runFlow:
          when:
            visible: 'Use Strong Password.*'
          commands:
            - tapOn:
                point: 92%,58%
