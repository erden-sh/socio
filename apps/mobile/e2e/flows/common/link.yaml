# Opens ${LINK} in the running app; iOS may ask first ("Open in …?"): Open.
appId: ${APP_ID}
name: link
---
- openLink: ${LINK}
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - tapOn: 'Open'
