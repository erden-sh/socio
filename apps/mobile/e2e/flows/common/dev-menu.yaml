# A development client opened after a clear shows its dev menu over the app
# once the bundle has loaded (a cold Metro bundles first, which takes a
# while): Android in a window of its own, closed with back; iOS in a sheet,
# swiped down. Waits for it and closes it. A build that carries its bundle
# has none.
appId: ${APP_ID}
name: close the dev menu
---
- runFlow:
    when:
      true: ${DEV_CLIENT_URL != ''}
    commands:
      - extendedWaitUntil:
          visible:
            text: 'Go home'
          timeout: 180000
          optional: true
      - runFlow:
          when:
            visible:
              text: 'Go home'
          commands:
            - runFlow:
                when:
                  platform: Android
                commands:
                  - back
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - swipe:
                      start: 50%, 50%
                      end: 50%, 98%
      - extendedWaitUntil:
          notVisible:
            text: 'Go home'
          timeout: 10000
