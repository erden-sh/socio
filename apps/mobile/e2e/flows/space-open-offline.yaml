# After space-open.yaml, with every workspace server stopped (Ctrl-C
# servers.mjs): a cold relaunch opens on A's Space, the workspace's last
# screen, its pages drawn from the phone's copy alone, the tree too; Back
# leads to Home. Run it with run.mjs --servers-down.
appId: ${APP_ID}
name: space-open-offline
---
- runFlow: common/open.yaml
- extendedWaitUntil:
    visible:
      id: space-screen
    timeout: 180000
- extendedWaitUntil:
    visible:
      text: '.*${SUBPAGE_A}.*'
    timeout: 10000
- assertVisible:
    text: '.*${PAGE_A}.*'
- takeScreenshot: space-open-offline
- tapOn:
    text: 'All pages'
- tapOn:
    id: 'space-tree-toggle-.*'
- extendedWaitUntil:
    visible:
      text: '.*${SUBPAGE_A}.*'
    timeout: 5000
- takeScreenshot: space-open-offline-tree
- runFlow: common/back.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
