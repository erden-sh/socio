# Three workspaces on one phone (servers.mjs --count 3; run.mjs --credentials):
# sign in to A, then add B and C from the drawer, then switch to A and to B
# through the drawer. Each time Home shows only the open workspace's marker
# chat. switch-three-offline.yaml then relaunches it with the servers stopped.
appId: ${APP_ID}
name: switch-three
---
- runFlow: launch.yaml
- runFlow:
    file: common/add-workspace.yaml
    env:
      ORIGIN: ${ORIGIN_A}
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: ada@example.test
      SECRET: ${PASSWORD}
- runFlow:
    file: common/only.yaml
    env: { SHOWN: '${CHAT_A}', HIDDEN_1: '${CHAT_B}', HIDDEN_2: '${CHAT_C}' }
- runFlow:
    file: common/add-another.yaml
    env:
      ORIGIN: ${ORIGIN_B}
- runFlow:
    file: common/only.yaml
    env: { SHOWN: '${CHAT_B}', HIDDEN_1: '${CHAT_A}', HIDDEN_2: '${CHAT_C}' }
- runFlow:
    file: common/add-another.yaml
    env:
      ORIGIN: ${ORIGIN_C}
- runFlow:
    file: common/only.yaml
    env: { SHOWN: '${CHAT_C}', HIDDEN_1: '${CHAT_A}', HIDDEN_2: '${CHAT_B}' }
- tapOn:
    id: open-workspaces
- tapOn:
    id: drawer-workspace-${HOST_A}
- runFlow:
    file: common/only.yaml
    env: { SHOWN: '${CHAT_A}', HIDDEN_1: '${CHAT_B}', HIDDEN_2: '${CHAT_C}' }
- takeScreenshot: switch-three-a
- tapOn:
    id: open-workspaces
- takeScreenshot: switch-three-drawer
- tapOn:
    id: drawer-workspace-${HOST_B}
- runFlow:
    file: common/only.yaml
    env: { SHOWN: '${CHAT_B}', HIDDEN_1: '${CHAT_A}', HIDDEN_2: '${CHAT_C}' }
- takeScreenshot: switch-three-b
